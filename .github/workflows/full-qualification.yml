name: Full qualification
on:
  workflow_call:
permissions:
  contents: read
  actions: read

jobs:
  stdlib:
    name: Core conformance (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # every leg at once (8 = the whole matrix): the run is as long as its slowest job, not its queue
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Real-host OpenCode qualification (tests/test_opencode_host.py): one pinned OpenCode on the newest Python leg of
      # each OS. The test fails, rather than skips, when this host is missing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.python == '3.13' }}
        with:
          node-version: '24.19.0'
      - name: OpenCode host 1.19.5
        if: ${{ matrix.python == '3.13' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund opencode-ai@1.19.5
          bin="$(find "$RUNNER_TEMP/opencode/node_modules" -type f | grep -E 'opencode-(linux|windows)-x64/bin/opencode(\.exe)?$' | head -1)"
          test -n "$bin"
          if command -v cygpath >/dev/null; then bin="$(cygpath -w "$bin")"; fi
          "$bin" --version
          echo "MODDING_HARNESS_OPENCODE_BIN=$bin" >> "$GITHUB_ENV"
          echo "MODDING_HARNESS_REQUIRE_OPENCODE_HOST=1" >> "$GITHUB_ENV"
      - name: Complete core conformance
        shell: bash
        # Step context owns runner.temp; job-level env cannot use runner context.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/conformance.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/conformance.log
          if-no-files-found: error

  full-required:
    name: Full qualification required
    needs: [stdlib]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-policy
        with:
          profile: core
          mode: verify
          required-jobs: '["stdlib"]'
          needs-json: ${{ toJSON(needs) }}
