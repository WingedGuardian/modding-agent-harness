name: Full qualification
on:
  workflow_call:
permissions:
  contents: read
  actions: read

jobs:
  stdlib:
    name: Core conformance (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # every leg at once (8 = the whole matrix): the run is as long as its slowest job, not its queue
      max-parallel: 8
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Complete core conformance
        shell: bash
        # Step context owns runner.temp; job-level env cannot use runner context.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/conformance.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/conformance.log
          if-no-files-found: error

  full-required:
    name: Full qualification required
    needs: [stdlib]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-policy
        with:
          profile: core
          mode: verify
          required-jobs: '["stdlib"]'
          needs-json: ${{ toJSON(needs) }}
